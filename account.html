<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>پنل کاربری | بلو مارکت</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ux.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/support-chat.css">
</head>
<body class="glass-body">
<a class="skip-to-content" href="#main-content">رفتن به محتوای اصلی</a>

<div id="header-placeholder"></div>

<main id="main-content" class="account-page">
    <div class="container bm-account-container">

        <nav class="bm-breadcrumb" aria-label="مسیر">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">خانه</a></li>
                <li class="breadcrumb-item active">پنل کاربری</li>
            </ol>
        </nav>

        <section class="profile-hero" id="profileHero"></section>

        <div class="row g-4">
            <aside class="col-lg-3">
                <div class="account-sidebar">
                    <nav class="sidebar-menu" role="tablist">
                        <button type="button" class="sidebar-menu-item active" data-tab="orders" onclick="AccountPage.switchTab('orders')">
                            <i class="bi bi-bag"></i>
                            سفارش‌ها
                            <span class="badge-count" id="badgeOrders">۰</span>
                        </button>
                        <button type="button" class="sidebar-menu-item" data-tab="wallet" onclick="AccountPage.switchTab('wallet')">
                            <i class="bi bi-wallet2"></i>
                            کیف پول
                            <span class="badge-count" id="badgeWallet">۰</span>
                        </button>
                        <button type="button" class="sidebar-menu-item" data-tab="profile" onclick="AccountPage.switchTab('profile')">
                            <i class="bi bi-person-circle"></i>
                            اطلاعات حساب
                        </button>
                        <button type="button" class="sidebar-menu-item" data-tab="addresses" onclick="AccountPage.switchTab('addresses')">
                            <i class="bi bi-geo-alt"></i>
                            آدرس‌ها
                            <span class="badge-count" id="badgeAddresses">۰</span>
                        </button>
                        <button type="button" class="sidebar-menu-item" data-tab="tickets" onclick="AccountPage.switchTab('tickets')">
                            <i class="bi bi-chat-dots"></i>
                            تیکت‌ها
                            <span class="badge-count" id="badgeTickets">۰</span>
                        </button>
                        <button type="button" class="sidebar-menu-item" data-tab="wishlist" onclick="AccountPage.switchTab('wishlist')">
                            <i class="bi bi-heart"></i>
                            علاقه‌مندی‌ها
                            <span class="badge-count" id="badgeWishlist">۰</span>
                        </button>
                        <div class="sidebar-menu-divider"></div>
                        <button type="button" class="sidebar-menu-item logout" onclick="handleLogoutClick(event)">
                            <i class="bi bi-box-arrow-right"></i>
                            خروج از حساب
                        </button>
                    </nav>
                </div>
            </aside>

            <div class="col-lg-9">
                <div class="account-content">
                    <section class="account-panel active" id="panel-orders"></section>
                    <section class="account-panel" id="panel-wallet"></section>
                    <section class="account-panel" id="panel-profile"></section>
                    <section class="account-panel" id="panel-addresses"></section>
                    <section class="account-panel" id="panel-tickets"></section>
                    <section class="account-panel" id="panel-wishlist"></section>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="footer-placeholder"></div>

<!-- BM Core -->
<script src="js/config.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/adapters/LocalStorageAdapter.js"></script>
<script src="js/adapters/ApiAdapter.js"></script>
<script src="js/repositories/ProductsRepository.js"></script>
<script src="js/repositories/OrdersRepository.js"></script>
<script src="js/repositories/UsersRepository.js"></script>
<script src="js/repositories/TicketsRepository.js"></script>
<script src="js/repositories/NotificationsRepository.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/products-data.js" defer></script>
<script src="js/product-images.js" defer></script>
<script src="js/bootstrap.js" defer></script>
<script src="js/notification-center.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/notifications.js" defer></script>
<script src="js/ux.js" defer></script>
<script src="js/modal.js" defer></script>
<script src="js/components.js" defer></script>
<script src="js/account.js" defer></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    Promise.all([
        fetch('components/header.html').then(r => r.text()),
        fetch('components/footer.html').then(r => r.text())
    ]).then(([headerHTML, footerHTML]) => {
        document.getElementById('header-placeholder').innerHTML = headerHTML;
        window.dispatchEvent(new CustomEvent('bl:header-ready'));
        if (typeof updateAuthUI === 'function') updateAuthUI();
        document.getElementById('footer-placeholder').innerHTML = footerHTML;
        if (typeof updateAuthUI === 'function') updateAuthUI();
        if (typeof updateCartBadge === 'function') updateCartBadge();
        if (window.AccountPage) setTimeout(() => AccountPage.init(), 50);
    });
});
</script>
<!-- SEO -->
<script src="js/seo.js" defer></script>
<script src="js/support-chat.js" defer></script>
</body>
</html>
