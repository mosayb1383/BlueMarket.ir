<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود مدیران | بلو مارکت</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-common.css">
</head>
<body class="admin-login">

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo-wrap">
                <div class="login-logo">
                    <img src="../images/logo.svg" alt="بلو مارکت" width="72" height="72" style="border-radius:20px;">
                </div>
            </div>

            <div class="login-header">
                <h1>بلو مارکت</h1>
                <p>ورود به پنل مدیریت</p>
            </div>

            <form id="loginForm">
                <div class="field">
                    <label for="adminEmail">
                        <i class="bi bi-envelope-fill"></i>
                        ایمیل مدیر
                    </label>
                    <div class="input-wrap">
                        <input type="email" id="adminEmail"
                               placeholder="admin@bluemarket.com"
                               autocomplete="username">
                        <i class="bi bi-person input-icon"></i>
                    </div>
                </div>

                <div class="field">
                    <label for="adminPassword">
                        <i class="bi bi-key-fill"></i>
                        رمز عبور
                    </label>
                    <div class="input-wrap">
                        <input type="password" id="adminPassword"
                               placeholder="••••••••••••"
                               autocomplete="current-password">
                        <button type="button" class="toggle-pass" onclick="togglePass()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <label class="remember-row">
                    <input type="checkbox" id="rememberMe">
                    <span>مرا به خاطر بسپار</span>
                </label>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span>ورود به پنل</span>
                </button>
            </form>

            <a href="../index.html" class="back-link">
                <i class="bi bi-arrow-right"></i>
                بازگشت به فروشگاه
            </a>

            <div class="login-security-note">
                <i class="bi bi-shield-check"></i>
                این یک نسخه دموست — اطلاعات ورود در همین مرورگر ذخیره می‌شود
            </div>
        </div>
    </div>

    <script>
    // ═══════ تنظیمات ورود ادمین ═══════
    const ADMIN_EMAIL = "admin@bluemarket.com";
    const ADMIN_PASSWORD = "Admin@2024#Bl";
    const SESSION_KEY = "bl_admin_session";
    const REMEMBER_KEY = "admin_remember_email";

    // ═══════ نمایش / مخفی کردن رمز ═══════
    function togglePass() {
        const input = document.getElementById("adminPassword");
        const icon = document.getElementById("toggleIcon");
        if (input.type === "password") {
            input.type = "text";
            icon.className = "bi bi-eye-slash";
        } else {
            input.type = "password";
            icon.className = "bi bi-eye";
        }
    }

    // ═══════ نمایش پیام ═══════
    function showToast(msg, type = "info") {
        const old = document.querySelector(".login-toast");
        if (old) old.remove();
        const t = document.createElement("div");
        t.className = "login-toast " + type;
        const icon = type === "success" ? "bi-check-circle-fill" : "bi-x-circle-fill";
        t.innerHTML = `<i class="bi ${icon}"></i><span>${msg}</span>`;
        document.body.appendChild(t);
        requestAnimationFrame(() => t.classList.add("show"));
        setTimeout(() => {
            t.classList.remove("show");
            setTimeout(() => t.remove(), 400);
        }, 3000);
    }

    // ═══════ سیستم قفل (برای جلوگیری از هک) ═══════
    function checkLock() {
        try {
            const data = JSON.parse(localStorage.getItem("bl_admin_lock") || "{}");
            if (data.until && data.until > Date.now()) {
                return Math.ceil((data.until - Date.now()) / 1000);
            }
            if (data.until && data.until <= Date.now()) {
                localStorage.removeItem("bl_admin_lock");
            }
        } catch (e) {}
        return 0;
    }

    function recordFail() {
        let data = { count: 0 };
        try {
            data = JSON.parse(localStorage.getItem("bl_admin_lock") || '{"count":0}');
        } catch (e) {}
        data.count = (data.count || 0) + 1;
        if (data.count >= 5) data.until = Date.now() + 5 * 60 * 1000; // ۵ دقیقه قفل
        localStorage.setItem("bl_admin_lock", JSON.stringify(data));
        return data;
    }

    function clearFail() {
        localStorage.removeItem("bl_admin_lock");
    }

    // ═══════ راه‌اندازی اولیه ═══════
    document.addEventListener("DOMContentLoaded", function () {

        // چک کردن سشن قبلی (اگر کاربر لاگین بود، می‌رود داشبورد)
        if (localStorage.getItem(SESSION_KEY)) {
            try {
                const s = JSON.parse(localStorage.getItem(SESSION_KEY));
                // اگر سشن هنوز منقضی نشده، مستقیم می‌رود داشبورد
                if (s && s.expiresAt > Date.now()) {
                    window.location.href = "dashboard.html";
                    return;
                } else {
                    // اگر منقضی شده، پاکش کن
                    localStorage.removeItem(SESSION_KEY);
                }
            } catch (e) {
                localStorage.removeItem(SESSION_KEY);
            }
        }

        // پر کردن ایمیل اگر قبلاً ذخیره شده
        const saved = localStorage.getItem(REMEMBER_KEY);
        if (saved) {
            document.getElementById("adminEmail").value = saved;
            document.getElementById("rememberMe").checked = true;
        }

        // ═══════ رویداد ثبت فرم ═══════
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const lockSec = checkLock();
            if (lockSec > 0) {
                showToast("حساب قفل است. " + lockSec + " ثانیه صبر کنید", "error");
                return;
            }

            const email = document.getElementById("adminEmail").value.trim().toLowerCase();
            const password = document.getElementById("adminPassword").value;
            const remember = document.getElementById("rememberMe").checked;
            const btn = document.getElementById("loginBtn");

            if (!email || !password) {
                showToast("لطفاً ایمیل و رمز را وارد کنید", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>در حال بررسی...</span>';

            // شبیه‌سازی تاخیر شبکه
            setTimeout(function () {
                if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
                    clearFail();
                    
                    // ساخت توکن سشن
                    const session = {
                        email: ADMIN_EMAIL,
                        name: "مدیر سیستم",
                        loginAt: Date.now(),
                        expiresAt: Date.now() + 24 * 60 * 60 * 1000, // ۲۴ ساعت
                    };
                    localStorage.setItem(SESSION_KEY, JSON.stringify(session));

                    if (remember) localStorage.setItem(REMEMBER_KEY, email);
                    else localStorage.removeItem(REMEMBER_KEY);

                    showToast("ورود موفق! در حال انتقال...", "success");
                    setTimeout(() => window.location.href = "dashboard.html", 700);
                } else {
                    const data = recordFail();
                    const remaining = 5 - (data.count || 0);

                    if (remaining <= 0) showToast("حساب ۵ دقیقه قفل شد", "error");
                    else showToast("ایمیل یا رمز اشتباه است. " + remaining + " تلاش باقی مانده", "error");

                    // افکت لرزش
                    document.querySelector(".login-card").classList.add("shake");
                    setTimeout(() => document.querySelector(".login-card").classList.remove("shake"), 400);

                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i><span>ورود به پنل</span>';
                }
            }, 500);
        });
    });
    </script>
    <script src="../js/notification-center.js"></script>
    <script src="../js/demo-events.js"></script>
</body>
</html>
