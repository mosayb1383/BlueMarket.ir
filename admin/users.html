<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کاربران | بلو مارکت</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-common.css">
    <link rel="stylesheet" href="admin-header.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <div class="admin-overlay" id="adminOverlay"></div>
        <div class="admin-main">
            <header class="admin-topbar" id="adminTopbar"></header>
            <main class="admin-content">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h3><i class="bi bi-people"></i> مدیریت کاربران</h3>
                        <input type="text" class="admin-search-input" id="userSearch" placeholder="جستجو در نام، ایمیل یا شماره..." oninput="UsersPage.search(this.value)">
                    </div>
                    <div class="admin-card-body">
                        <div id="usersList"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="admin-modal-backdrop" id="userModal">
        <div class="admin-modal" style="max-width:620px;">
            <div class="admin-modal-header">
                <h4><i class="bi bi-person-circle"></i> جزئیات کاربر</h4>
                <button class="admin-modal-close" onclick="AdminApp.closeModal('userModal')"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="admin-modal-body" id="userModalBody"></div>
        </div>
    </div>

<script src="../js/notification-center.js"></script>
    <script src="admin-common.js"></script>
    <script>
    const UsersPage = {
        state: { users: [], search: "" },

        init() {
            if (!AdminApp.initPage("users", "کاربران")) return;
            this.load();
            this.render();
        },

        load() {
            const users = AdminApp.getUsers();
            const orders = AdminApp.getOrders();
            this.state.users = users.map(u => {
                const userOrders = orders.filter(o => o.userEmail === u.email);
                const totalSpent = userOrders.reduce((s, o) => s + (o.total || 0), 0);
                return { ...u, ordersCount: userOrders.length, totalSpent };
            });
        },

        search(t) {
            this.state.search = (t || "").trim().toLowerCase();
            this.render();
        },

        getFiltered() {
            const t = this.state.search;
            if (!t) return [...this.state.users];
            return this.state.users.filter(u =>
                (u.name || "").toLowerCase().includes(t) ||
                (u.email || "").toLowerCase().includes(t) ||
                (u.phone || "").toLowerCase().includes(t)
            );
        },

        render() {
            const list = this.getFiltered();
            const el = document.getElementById("usersList");
            if (list.length === 0) {
                el.innerHTML = `<div class="admin-empty"><div class="admin-empty-icon"><i class="bi bi-people"></i></div><h4>کاربری یافت نشد</h4><p>${this.state.search ? "نتیجه‌ای برای جستجو نیست" : "هنوز کاربری ثبت‌نام نکرده"}</p></div>`;
                return;
            }
            el.innerHTML = `<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>کاربر</th><th>ایمیل</th><th>موبایل</th><th>سفارشات</th><th>مجموع خرید</th><th>عضویت</th><th>عملیات</th></tr></thead><tbody>${list.map(u => this.row(u)).join("")}</tbody></table></div>`;
        },

        row(u) {
            const colors = ["orange", "blue", "green", "purple", "pink", "red"];
            const color = colors[(u.id || 0) % colors.length];
            const initial = (u.firstName?.[0] || u.name?.[0] || "؟").toUpperCase();
            return `<tr>
                <td><div class="table-user-info">
                    <div class="table-avatar-initial ${color}">${initial}</div>
                    <div><div class="name">${AdminApp.escape(u.name || "کاربر")}</div><div style="font-size:0.72rem;color:#94a3b8;">#${u.id || "—"}</div></div>
                </div></td>
                <td>${AdminApp.escape(u.email || "—")}</td>
                <td>${AdminApp.escape(u.phone || "—")}</td>
                <td>${u.ordersCount.toLocaleString("fa-IR")}</td>
                <td>${AdminApp.formatPrice(u.totalSpent)}</td>
                <td>${AdminApp.formatDate(u.registeredAt)}</td>
                <td><div class="action-buttons">
                    <button class="action-btn-sm view" onclick="UsersPage.openDetail('${AdminApp.escape(u.email)}')" title="مشاهده"><i class="bi bi-eye"></i></button>
                    <button class="action-btn-sm delete" onclick="UsersPage.remove('${AdminApp.escape(u.email)}')" title="حذف"><i class="bi bi-trash"></i></button>
                </div></td>
            </tr>`;
        },

        openDetail(email) {
            const user = this.state.users.find(u => u.email === email);
            if (!user) return;
            const orders = AdminApp.getOrders().filter(o => o.userEmail === email);
            const initial = (user.firstName?.[0] || user.name?.[0] || "؟").toUpperCase();
            document.getElementById("userModalBody").innerHTML = `
                <div class="user-detail-header">
                    <div class="user-detail-avatar">${initial}</div>
                    <div><h3>${AdminApp.escape(user.name || "کاربر")}</h3><p>${AdminApp.escape(user.email || "")}</p></div>
                </div>
                <div class="user-detail-grid">
                    <div class="user-detail-item"><span class="label">شماره موبایل</span><span class="value">${AdminApp.escape(user.phone || "—")}</span></div>
                    <div class="user-detail-item"><span class="label">تاریخ عضویت</span><span class="value">${AdminApp.formatDate(user.registeredAt)}</span></div>
                    <div class="user-detail-item"><span class="label">تعداد سفارشات</span><span class="value">${user.ordersCount.toLocaleString("fa-IR")}</span></div>
                    <div class="user-detail-item"><span class="label">مجموع خرید</span><span class="value">${AdminApp.formatPrice(user.totalSpent)}</span></div>
                </div>
                ${orders.length > 0 ? `
                    <h4 class="admin-subsection-title"><i class="bi bi-bag-check"></i> سفارشات این کاربر</h4>
                    <div style="display:flex;flex-direction:column;gap:8px;">
                        ${orders.slice(0, 10).map(o => `
                            <div class="order-detail-item" style="padding:10px 14px;">
                                <div class="order-detail-item-info"><div class="order-detail-item-name">${AdminApp.escape(o.id)}</div><div class="order-detail-item-meta">${AdminApp.formatDate(o.createdAt)}</div></div>
                                <div class="order-detail-item-price">${AdminApp.formatPrice(o.total)}</div>
                            </div>
                        `).join("")}
                    </div>
                ` : ""}
            `;
            AdminApp.openModal("userModal");
        },

        remove(email) {
            const user = this.state.users.find(u => u.email === email);
            if (!user) return;
            AdminApp.customConfirm(`کاربر «${user.name}» حذف شود؟`, () => {
                try {
                    const raw = localStorage.getItem("registeredUsers");
                    const parsed = JSON.parse(raw || "[]");
                    let updated;
                    if (Array.isArray(parsed)) updated = parsed.filter(u => u.email !== email);
                    else { delete parsed[email]; updated = parsed; }
                    localStorage.setItem("registeredUsers", JSON.stringify(updated));
                    this.load();
                    this.render();
                    AdminApp.toast("کاربر حذف شد", "success");
                } catch (e) {
                    AdminApp.toast("خطا در حذف کاربر", "error");
                }
            });
        },
    };

    document.addEventListener("DOMContentLoaded", () => UsersPage.init());
    </script>
<script src="../js/demo-events.js"></script>
</body>
</html>
