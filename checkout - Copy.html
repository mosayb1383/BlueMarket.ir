<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6b35">
    <meta name="robots" content="noindex, nofollow">

    <title>تکمیل خرید | موبایلی بلوچستان</title>
    <meta name="description" content="تکمیل خرید و پرداخت امن در فروشگاه موبایلی بلوچستان">

    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ux.css">
    <link rel="stylesheet" href="css/user-panel.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/checkout.css">
<link rel="stylesheet" href="css/support-chat.css">
</head>

<body class="glass-body">
<a class="skip-to-content" href="#main-content">رفتن به محتوای اصلی</a>

    <!-- هدر -->
    <div id="header-placeholder"></div>

    <!-- صفحه -->
    <main id="main-content" class="checkout-page">
        <div class="container">

            <!-- Breadcrumb -->
            <nav class="checkout-breadcrumb" aria-label="مسیر صفحه">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">خانه</a></li>
                    <li class="breadcrumb-item"><a href="cart.html">سبد خرید</a></li>
                    <li class="breadcrumb-item active" aria-current="page">تکمیل خرید</li>
                </ol>
            </nav>

            <!-- مراحل -->
            <div class="checkout-steps" id="checkoutSteps"></div>

            <!-- محتوای اصلی -->
            <div id="checkoutMain">
                <div class="row g-4">

                    <!-- ستون چپ -->
                    <div class="col-lg-7">
                        <div class="checkout-card" id="addressesSection"></div>
                        <div class="checkout-card" id="deliverySection"></div>
                        <div class="checkout-card" id="paymentSection"></div>
                    </div>

                    <!-- ستون راست - خلاصه -->
                    <div class="col-lg-5">
                        <div class="order-summary-sticky" id="summarySection"></div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Modal آدرس جدید -->
    <div class="address-modal-backdrop" id="checkoutAddressModal">
        <div class="address-modal-box" style="background:white;border-radius:22px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.25);">
            <div class="address-modal-header" style="display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid #f3f4f6;">
                <h4 style="margin:0;font-size:1.1rem;font-weight:800;color:#1f2937;display:flex;align-items:center;gap:8px;">
                    <i class="bi bi-geo-alt" style="color:#f97316;"></i>
                    افزودن آدرس جدید
                </h4>
                <button type="button" class="modal-close-btn" onclick="CheckoutPage.closeAddressModal()"
                        style="width:34px;height:34px;border-radius:50%;border:none;background:#f3f4f6;color:#6b7280;cursor:pointer;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <div class="address-modal-body" style="padding:24px 26px;">
                <div style="margin-bottom:16px;">
                    <label style="display:block;font-size:0.85rem;font-weight:700;color:#374151;margin-bottom:8px;">عنوان آدرس *</label>
                    <input type="text" id="newAddrTitle" placeholder="مثال: منزل، محل کار"
                           style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.92rem;font-family:inherit;"
                           maxlength="40">
                </div>

                <div class="row g-3" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
                    <div>
                        <label style="display:block;font-size:0.85rem;font-weight:700;color:#374151;margin-bottom:8px;">استان *</label>
                        <select id="newAddrProvince" style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.92rem;font-family:inherit;">
                            <option value="">انتخاب کنید</option>
                            <option>سیستان و بلوچستان</option>
                            <option>تهران</option>
                            <option>خراسان رضوی</option>
                            <option>اصفهان</option>
                            <option>فارس</option>
                            <option>البرز</option>
                            <option>گیلان</option>
                            <option>مازندران</option>
                        </select>
                    </div>
                    <div>
                        <label style="display:block;font-size:0.85rem;font-weight:700;color:#374151;margin-bottom:8px;">شهر *</label>
                        <input type="text" id="newAddrCity" maxlength="40"
                               style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.92rem;font-family:inherit;">
                    </div>
                </div>

                <div style="margin-top:16px;">
                    <label style="display:block;font-size:0.85rem;font-weight:700;color:#374151;margin-bottom:8px;">آدرس کامل *</label>
                    <textarea id="newAddrFull" rows="3" maxlength="300"
                              placeholder="خیابان، کوچه، پلاک، واحد"
                              style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.92rem;font-family:inherit;resize:vertical;"></textarea>
                </div>

                <div class="row g-3" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;">
                    <div>
                        <label style="display:block;font-size:0.85rem;font-weight:700;color:#374151;margin-bottom:8px;">کد پستی</label>
                        <input type="text" id="newAddrPostal" maxlength="10" inputmode="numeric"
                               style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.92rem;font-family:inherit;">
                    </div>
                    <div>
                        <label style="display:block;font-size:0.85rem;font-weight:700;color:#374151;margin-bottom:8px;">تلفن</label>
                        <input type="tel" id="newAddrPhone" maxlength="11" inputmode="numeric"
                               style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:12px;font-size:0.92rem;font-family:inherit;">
                    </div>
                </div>

                <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:16px;font-size:0.85rem;color:#4b5563;">
                    <input type="checkbox" id="newAddrDefault">
                    <span>این آدرس را به عنوان پیش‌فرض تنظیم کن</span>
                </label>
            </div>

            <div class="address-modal-footer" style="padding:18px 26px;border-top:1px solid #f3f4f6;display:flex;gap:10px;justify-content:flex-end;">
                <button type="button" class="btn btn-outline-secondary" onclick="CheckoutPage.closeAddressModal()">انصراف</button>
                <button type="button" class="btn btn-primary" onclick="CheckoutPage.saveNewAddress()">
                    <i class="bi bi-check-circle me-1"></i>
                    ذخیره آدرس
                </button>
            </div>
        </div>
    </div>

    <!-- فوتر -->
    <div id="footer-placeholder"></div>

    <!-- اسکریپت‌ها -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/notification-center.js" defer></script>
    <script src="js/auth.js" defer></script>
<script src="js/main.js" defer></script>

    <script src="js/notifications.js" defer></script>
    <script src="js/ux.js" defer></script>
    <script src="js/modal.js" defer></script>
    <script src="js/product-images.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/checkout.js" defer></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        Promise.all([
            fetch('components/header.html').then(r => r.text()),
            fetch('components/footer.html').then(r => r.text())
        ]).then(([headerHTML, footerHTML]) => {
            document.getElementById('header-placeholder').innerHTML = headerHTML;
            window.dispatchEvent(new CustomEvent('bl:header-ready'));
            if (typeof updateAuthUI === 'function') updateAuthUI();
            document.getElementById('footer-placeholder').innerHTML = footerHTML;
            window.dispatchEvent(new CustomEvent('bl:header-ready'));

            if (typeof updateAuthUI === 'function') updateAuthUI();
            if (typeof updateCartBadge === 'function') updateCartBadge();
            if (typeof setupHeaderScroll === 'function') setupHeaderScroll();

            if (window.CheckoutPage) {
                setTimeout(() => CheckoutPage.init(), 50);
            }
        }).catch(err => console.error('خطا در لود کامپوننت‌ها:', err));
    });
    </script>
    <!-- SEO -->
<script src="js/seo.js" defer></script>
<script src="js/support-chat.js" defer></script>
</body>
</html>
