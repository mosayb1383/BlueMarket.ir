<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">
    <meta name="robots" content="noindex, nofollow">
    <title>تکمیل خرید | بلو مارکت</title>
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ux.css">
    <link rel="stylesheet" href="css/glass.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="css/support-chat.css">
</head>
<body class="glass-body">
<a class="skip-to-content" href="#main-content">رفتن به محتوای اصلی</a>

<div id="header-placeholder"></div>

<main id="main-content" class="checkout-page">
    <div class="container bm-checkout-container">

        <nav class="bm-breadcrumb" aria-label="مسیر">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">خانه</a></li>
                <li class="breadcrumb-item"><a href="cart.html">سبد خرید</a></li>
                <li class="breadcrumb-item active">تکمیل خرید</li>
            </ol>
        </nav>

        <div class="bm-checkout-steps" id="checkoutSteps"></div>

        <div id="checkoutMain">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="checkout-card" id="addressesSection"></div>
                    <div class="checkout-card" id="deliverySection"></div>
                    <div class="checkout-card" id="paymentSection"></div>
                </div>
                <div class="col-lg-5">
                    <div class="order-summary-sticky" id="summarySection"></div>
                </div>
            </div>
        </div>

    </div>
</main>

<div class="address-modal-backdrop" id="checkoutAddressModal">
    <div class="address-modal-box">
        <div class="address-modal-header">
            <h4><i class="bi bi-geo-alt"></i> افزودن آدرس جدید</h4>
            <button type="button" class="modal-close-btn" onclick="CheckoutPage.closeAddressModal()">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div class="address-modal-body">
            <div class="bm-form-group">
                <label>عنوان آدرس *</label>
                <input type="text" id="newAddrTitle" placeholder="مثال: منزل، محل کار" maxlength="40">
            </div>
            <div class="bm-form-row">
                <div class="bm-form-group">
                    <label>استان *</label>
                    <select id="newAddrProvince">
                        <option value="">انتخاب کنید</option>
                        <option>سیستان و بلوچستان</option>
                        <option>تهران</option>
                        <option>خراسان رضوی</option>
                        <option>اصفهان</option>
                        <option>فارس</option>
                        <option>البرز</option>
                        <option>گیلان</option>
                        <option>مازندران</option>
                    </select>
                </div>
                <div class="bm-form-group">
                    <label>شهر *</label>
                    <input type="text" id="newAddrCity" maxlength="40">
                </div>
            </div>
            <div class="bm-form-group">
                <label>آدرس کامل *</label>
                <textarea id="newAddrFull" rows="3" maxlength="300" placeholder="خیابان، کوچه، پلاک، واحد"></textarea>
            </div>
            <div class="bm-form-row">
                <div class="bm-form-group">
                    <label>کد پستی</label>
                    <input type="text" id="newAddrPostal" maxlength="10" inputmode="numeric">
                </div>
                <div class="bm-form-group">
                    <label>تلفن</label>
                    <input type="tel" id="newAddrPhone" maxlength="11" inputmode="numeric">
                </div>
            </div>
            <label class="bm-checkbox-label">
                <input type="checkbox" id="newAddrDefault">
                <span>این آدرس را به عنوان پیش‌فرض ذخیره کن</span>
            </label>
        </div>
        <div class="address-modal-footer">
            <button type="button" class="bm-btn-outline" onclick="CheckoutPage.closeAddressModal()">انصراف</button>
            <button type="button" class="bm-btn-primary" onclick="CheckoutPage.saveNewAddress()">
                <i class="bi bi-check-circle"></i> ذخیره آدرس
            </button>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<!-- BM Core -->
<script src="js/config.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/adapters/LocalStorageAdapter.js"></script>
<script src="js/adapters/ApiAdapter.js"></script>
<script src="js/repositories/ProductsRepository.js"></script>
<script src="js/repositories/OrdersRepository.js"></script>
<script src="js/repositories/UsersRepository.js"></script>
<script src="js/repositories/TicketsRepository.js"></script>
<script src="js/repositories/NotificationsRepository.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/products-data.js" defer></script>
<script src="js/product-images.js" defer></script>
<script src="js/bootstrap.js" defer></script>
<script src="js/notification-center.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/notifications.js" defer></script>
<script src="js/ux.js" defer></script>
<script src="js/modal.js" defer></script>
<script src="js/components.js" defer></script>
<script src="js/checkout.js" defer></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    Promise.all([
        fetch('components/header.html').then(r => r.text()),
        fetch('components/footer.html').then(r => r.text())
    ]).then(([headerHTML, footerHTML]) => {
        document.getElementById('header-placeholder').innerHTML = headerHTML;
        window.dispatchEvent(new CustomEvent('bl:header-ready'));
        if (typeof updateAuthUI === 'function') updateAuthUI();

        document.getElementById('footer-placeholder').innerHTML = footerHTML;
        window.dispatchEvent(new CustomEvent('bl:header-ready'));

        if (typeof updateAuthUI === 'function') updateAuthUI();
        if (typeof updateCartBadge === 'function') updateCartBadge();

        if (window.CheckoutPage) setTimeout(() => CheckoutPage.init(), 100);
    });
});
</script>
<!-- SEO -->
<script src="js/seo.js" defer></script>
<script src="js/support-chat.js" defer></script>
</body>
</html>
