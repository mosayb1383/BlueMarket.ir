<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله | بلو مارکت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <style>
        .force-post-cover {
            width: 100%; max-width: 900px; height: 450px; margin: 0 auto 40px;
            border-radius: 24px; overflow: hidden; background: #f8f9fa;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .force-post-cover img { width: 100%; height: 100%; object-fit: contain; }
        .bm-back-to-blog {
            display: inline-flex; align-items: center; gap: 8px;
            background: #fff; color: #f97316; padding: 10px 20px;
            border-radius: 12px; text-decoration: none; font-weight: 800;
            font-size: 0.88rem; border: 2px solid rgba(249, 115, 22, 0.2);
            transition: all 0.25s ease; margin-bottom: 24px;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.08);
        }
        .bm-back-to-blog:hover {
            background: #f97316; color: #fff; transform: translateX(-3px);
        }
        @media (max-width: 767px) {
            .force-post-cover { height: 250px; border-radius: 16px; }
        }
    </style>
</head>
<body class="glass-body">

    <div id="header-placeholder"></div>

    <main id="main-content" style="padding-top: 30px; padding-bottom: 40px;">
        <div class="container">

            <a href="blog.html" class="bm-back-to-blog">
                <i class="bi bi-arrow-right"></i>
                برگشت به مقالات
            </a>

            <div class="bm-post-header" style="text-align: center; max-width: 800px; margin: 0 auto 30px;">
                <span class="bm-blog-tag" id="blogPostTag">راهنمای خرید</span>
                <h1 class="bm-post-title" id="blogPostTitle">در حال بارگذاری...</h1>
                <div class="bm-post-meta" id="blogPostMeta"></div>
            </div>

            <div style="padding: 0 16px;">
                <div class="force-post-cover">
                    <img id="blogPostCover" src="images/products/placeholder-product.svg" alt="کاور مقاله">
                </div>
            </div>

            <div class="container">
                <article class="bm-post-content" id="blogPostContent" style="max-width: 800px; margin: 0 auto 60px;">
                    <p>در حال بارگذاری محتوا...</p>
                </article>

                <div style="max-width: 800px; margin: 0 auto 40px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
                    <a href="blog.html" class="bm-btn-primary" style="padding: 12px 24px; border-radius: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="bi bi-arrow-right"></i>
                        برگشت به لیست مقالات
                    </a>
                    <a href="products.html" class="bm-btn-outline" style="padding: 12px 24px; border-radius: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="bi bi-shop"></i>
                        مشاهده محصولات
                    </a>
                </div>

                <div class="bm-related-posts" style="max-width: 1100px; margin: 0 auto; border-top: 2px solid #f3f4f6; padding-top: 40px;">
                    <h3 style="font-size: 1.5rem; font-weight: 800; color: #1f2937; margin-bottom: 24px; text-align: center;">
                        مقالات مرتبط
                    </h3>
                    <div class="bm-blog-archive-grid" id="relatedPostsGrid"></div>
                </div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

<!-- BM Core -->
<script src="js/config.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/adapters/LocalStorageAdapter.js"></script>
<script src="js/adapters/ApiAdapter.js"></script>
<script src="js/repositories/ProductsRepository.js"></script>
<script src="js/repositories/OrdersRepository.js"></script>
<script src="js/repositories/UsersRepository.js"></script>
<script src="js/repositories/TicketsRepository.js"></script>
<script src="js/repositories/NotificationsRepository.js"></script>
<script src="js/bootstrap.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="js/notification-center.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/notifications.js" defer></script>
<script src="js/ux.js" defer></script>
<script src="js/modal.js" defer></script>
<script src="js/components.js" defer></script>
<script src="js/blog-data.js" defer></script>
<script src="js/blog.js" defer></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    Promise.all([
        fetch('components/header.html').then(r => r.text()),
        fetch('components/footer.html').then(r => r.text())
    ]).then(([headerHTML, footerHTML]) => {
        document.getElementById('header-placeholder').innerHTML = headerHTML;
        window.dispatchEvent(new CustomEvent('bl:header-ready'));
        document.getElementById('footer-placeholder').innerHTML = footerHTML;
        if (typeof updateAuthUI === 'function') updateAuthUI();
        if (typeof updateCartBadge === 'function') updateCartBadge();
    });
});
</script>
<!-- SEO -->
<script src="js/seo.js" defer></script>
<script src="js/support-chat.js" defer></script>
</body>
</html>
