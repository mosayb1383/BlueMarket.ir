<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقاله | بلو مارکت</title>
    <meta name="description" content="مقاله از بلو مارکت — راهنمای خرید و آگاهی قبل از خرید محصولات دیجیتال.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://YOUR-DOMAIN.ir/blog-post.html">

    <meta property="og:type" content="article">
    <meta property="og:site_name" content="بلو مارکت">
    <meta property="og:locale" content="fa_IR">
    <meta property="og:title" content="مقاله | بلو مارکت">
    <meta property="og:description" content="مقاله از بلو مارکت">
    <meta property="og:url" content="https://YOUR-DOMAIN.ir/blog-post.html">
    <meta property="og:image" content="https://YOUR-DOMAIN.ir/images/logo.svg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="مقاله | بلو مارکت">

    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="manifest" href="manifest.json">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/support-chat.css">
</head>
<body class="glass-body">

    <div id="header-placeholder"></div>

    <main id="main-content" style="padding-top: 30px; padding-bottom: 40px;">
        <div class="container">

            <a href="blog.html" class="bm-back-to-blog">
                <i class="bi bi-arrow-right"></i>
                برگشت به مقالات
            </a>

            <div class="bm-post-header" style="text-align: center; max-width: 800px; margin: 0 auto 30px;">
                <span class="bm-blog-tag" id="blogPostTag">راهنمای خرید</span>
                <h1 class="bm-post-title" id="blogPostTitle">در حال بارگذاری...</h1>
                <div class="bm-post-meta" id="blogPostMeta"></div>
            </div>

            <div style="padding: 0 16px;">
                <div class="force-post-cover">
                    <img id="blogPostCover" src="images/products/placeholder-product.svg" alt="کاور مقاله">
                </div>
            </div>

            <div class="container">
                <article class="bm-post-content" id="blogPostContent" style="max-width: 800px; margin: 0 auto 60px;">
                    <p>در حال بارگذاری محتوا...</p>
                </article>

                <div style="max-width: 800px; margin: 0 auto 40px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
                    <a href="blog.html" class="bm-btn-primary" style="padding: 12px 24px; border-radius: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="bi bi-arrow-right"></i>
                        برگشت به لیست مقالات
                    </a>
                    <a href="products.html" class="bm-btn-outline" style="padding: 12px 24px; border-radius: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="bi bi-shop"></i>
                        مشاهده محصولات
                    </a>
                </div>

                <div class="bm-related-posts" style="max-width: 1100px; margin: 0 auto; border-top: 2px solid #f3f4f6; padding-top: 40px;">
                    <h3 style="font-size: 1.5rem; font-weight: 800; color: #1f2937; margin-bottom: 24px; text-align: center;">
                        مقالات مرتبط
                    </h3>
                    <div class="bm-blog-archive-grid" id="relatedPostsGrid"></div>
                </div>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/blog-data.js"></script>
    <script src="js/blog.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        Promise.all([
            fetch('components/header.html').then(r => r.text()),
            fetch('components/footer.html').then(r => r.text())
        ]).then(([headerHTML, footerHTML]) => {
            document.getElementById('header-placeholder').innerHTML = headerHTML;
            window.dispatchEvent(new CustomEvent('bl:header-ready'));
            document.getElementById('footer-placeholder').innerHTML = footerHTML;
            if (typeof updateAuthUI === 'function') updateAuthUI();
        });
    });
    </script>
</body>
</html>
