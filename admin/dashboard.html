<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد | بلو مارکت</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="admin-common.css">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="admin-header.css">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar" id="adminSidebar"></aside>
        <div class="admin-overlay" id="adminOverlay"></div>

        <div class="admin-main">
            <header class="admin-topbar" id="adminTopbar"></header>
            <main class="admin-content">
                <div class="stats-grid" id="statsGrid"></div>
                <div class="dashboard-grid">
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h3><i class="bi bi-bag-check"></i> آخرین سفارشات</h3>
                            <a href="orders.html" class="btn-outline-admin">مشاهده همه</a>
                        </div>
                        <div class="admin-card-body" id="recentOrders"></div>
                    </div>
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h3><i class="bi bi-chat-dots"></i> آخرین تیکت‌ها</h3>
                            <a href="tickets.html" class="btn-outline-admin">مشاهده همه</a>
                        </div>
                        <div class="admin-card-body" id="recentTickets"></div>
                    </div>
                </div>

                <div class="dashboard-grid" style="margin-top:24px;">
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h3><i class="bi bi-trophy"></i> پرفروش‌ترین محصولات</h3>
                        </div>
                        <div class="admin-card-body" id="topProducts"></div>
                    </div>
                    <div class="admin-card">
                        <div class="admin-card-header">
                            <h3><i class="bi bi-exclamation-triangle"></i> هشدارها</h3>
                        </div>
                        <div class="admin-card-body" id="alertsBox"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

<script src="../js/notification-center.js"></script>
    <script src="admin-common.js"></script>
    <script src="../js/products-data.js"></script>
    <script src="../js/product-images.js"></script>
    <script src="../js/bootstrap.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        if (!AdminApp.initPage("dashboard", "داشبورد")) return;
        renderDashboard();
    });

    function renderDashboard() {
        const products = AdminApp.getProducts();
        const orders = AdminApp.getOrders();
        const users = AdminApp.getUsers();
        const tickets = AdminApp.getTickets();

        const revenue = orders.reduce((s, o) => s + (o.total || 0), 0);
        const newOrders = orders.filter(o => !o.adminRead).length;
        const unreadTickets = tickets.filter(t => !t.adminRead).length;
        const openTickets = tickets.filter(t => t.status === "open").length;
        const demoProducts = products.filter(p => p.isDemo).length;
        const outOfStock = products.filter(p => p.stock === 0).length;
        const lowStock = products.filter(p => p.stock > 0 && p.stock <= 5).length;

        document.getElementById("statsGrid").innerHTML = `
            <div class="stat-card orange">
                <div class="stat-header"><div class="stat-icon"><i class="bi bi-box-seam"></i></div></div>
                <div class="stat-value">${products.length.toLocaleString("fa-IR")}</div>
                <div class="stat-label">کل محصولات</div>
                ${demoProducts > 0 ? `<div class="stat-change up" style="background:#f1f5f9;color:#64748b;"><i class="bi bi-info-circle"></i> ${demoProducts} Demo</div>` : ""}
            </div>
            <div class="stat-card green">
                <div class="stat-header"><div class="stat-icon"><i class="bi bi-bag-check"></i></div></div>
                <div class="stat-value">${orders.length.toLocaleString("fa-IR")}</div>
                <div class="stat-label">کل سفارشات</div>
                ${newOrders > 0 ? `<div class="stat-change up"><i class="bi bi-arrow-up"></i> ${newOrders} جدید</div>` : ""}
            </div>
            <div class="stat-card blue">
                <div class="stat-header"><div class="stat-icon"><i class="bi bi-people"></i></div></div>
                <div class="stat-value">${users.length.toLocaleString("fa-IR")}</div>
                <div class="stat-label">کاربران</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-header"><div class="stat-icon"><i class="bi bi-cash-coin"></i></div></div>
                <div class="stat-value">${AdminApp.formatPrice(revenue)}</div>
                <div class="stat-label">درآمد کل</div>
            </div>
            <div class="stat-card red">
                <div class="stat-header"><div class="stat-icon"><i class="bi bi-chat-dots"></i></div></div>
                <div class="stat-value">${tickets.length.toLocaleString("fa-IR")}</div>
                <div class="stat-label">کل تیکت‌ها</div>
                ${unreadTickets > 0 ? `<div class="stat-change down"><i class="bi bi-exclamation-circle"></i> ${unreadTickets} خوانده‌نشده</div>` : ""}
            </div>
            <div class="stat-card pink">
                <div class="stat-header"><div class="stat-icon"><i class="bi bi-ticket-perforated"></i></div></div>
                <div class="stat-value">${openTickets.toLocaleString("fa-IR")}</div>
                <div class="stat-label">تیکت‌های باز</div>
            </div>
        `;

        // آخرین سفارشات
        const oEl = document.getElementById("recentOrders");
        if (orders.length === 0) {
            oEl.innerHTML = `<div class="admin-empty"><div class="admin-empty-icon"><i class="bi bi-bag-x"></i></div><h4>سفارشی نیست</h4><p>هنوز سفارشی ثبت نشده</p></div>`;
        } else {
            oEl.innerHTML = `
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead><tr><th>شناسه</th><th>مبلغ</th><th>وضعیت</th><th>تاریخ</th></tr></thead>
                        <tbody>
                            ${orders.slice(0, 5).map(o => `
                                <tr style="cursor:pointer;" onclick="location.href='orders.html'">
                                    <td><strong>${AdminApp.escape(o.id || "—")}</strong></td>
                                    <td>${AdminApp.formatPrice(o.total)}</td>
                                    <td><span class="status-badge ${getStatusClass(o.status)}">${getStatusLabel(o.status)}</span></td>
                                    <td>${AdminApp.formatDate(o.createdAt)}</td>
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // آخرین تیکت‌ها
        const tEl = document.getElementById("recentTickets");
        if (tickets.length === 0) {
            tEl.innerHTML = `<div class="admin-empty"><div class="admin-empty-icon"><i class="bi bi-chat-square-text"></i></div><h4>تیکتی نیست</h4><p>هنوز تیکتی ثبت نشده</p></div>`;
        } else {
            tEl.innerHTML = tickets.slice(0, 5).map(t => `
                <div class="ticket-row-item" onclick="location.href='tickets.html'">
                    <div class="ticket-icon ${t.adminRead ? '' : 'unread'}">
                        <i class="bi bi-chat-dots-fill"></i>
                    </div>
                    <div class="ticket-content">
                        <div class="ticket-title">${AdminApp.escape(t.subject)}</div>
                        <div class="ticket-meta">${AdminApp.escape(t.userName || "کاربر")} — ${AdminApp.timeAgo(t.createdAt)}</div>
                    </div>
                    <span class="status-badge ${t.status === "open" ? "warning" : t.status === "closed" ? "neutral" : "info"}">
                        ${t.status === "open" ? "باز" : t.status === "closed" ? "بسته" : "پاسخ"}
                    </span>
                </div>
            `).join("");
        }

        // پرفروش‌ترین‌ها
        const productSales = {};
        orders.forEach(o => {
            (o.items || []).forEach(item => {
                const key = String(item.id);
                if (!productSales[key]) productSales[key] = { ...item, totalQty: 0, totalPrice: 0 };
                productSales[key].totalQty += item.quantity || 1;
                productSales[key].totalPrice += (item.price || 0) * (item.quantity || 1);
            });
        });
        const top = Object.values(productSales).sort((a, b) => b.totalQty - a.totalQty).slice(0, 5);
        const topEl = document.getElementById("topProducts");
        if (top.length === 0) {
            topEl.innerHTML = `<div class="admin-empty"><div class="admin-empty-icon"><i class="bi bi-trophy"></i></div><h4>فروشی نیست</h4><p>هنوز فروشی ثبت نشده</p></div>`;
        } else {
            topEl.innerHTML = top.map((p, i) => `
                <div class="report-product-row">
                    <div class="report-rank ${i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : ''}">${(i + 1).toLocaleString("fa-IR")}</div>
                    <img src="${AdminApp.escape(p.image || '')}" onerror="this.onerror=null;this.src='../images/products/placeholder-product.svg'">
                    <div class="report-product-info">
                        <div class="name">${AdminApp.escape(p.name || "—")}</div>
                        <div class="meta">${p.totalQty.toLocaleString("fa-IR")} عدد</div>
                    </div>
                    <div class="report-product-value">${AdminApp.formatPrice(p.totalPrice)}</div>
                </div>
            `).join("");
        }

        // هشدارها
        const alertEl = document.getElementById("alertsBox");
        const alerts = [];

        if (outOfStock > 0) {
            alerts.push({ icon: "bi-x-circle", color: "red", text: `${outOfStock.toLocaleString("fa-IR")} محصول ناموجود است`, link: "products.html" });
        }
        if (lowStock > 0) {
            alerts.push({ icon: "bi-exclamation-triangle", color: "orange", text: `${lowStock.toLocaleString("fa-IR")} محصول موجودی کم دارد (≤ ۵)`, link: "products.html" });
        }
        if (unreadTickets > 0) {
            alerts.push({ icon: "bi-chat-dots", color: "purple", text: `${unreadTickets.toLocaleString("fa-IR")} تیکت خوانده‌نشده`, link: "tickets.html" });
        }
        if (newOrders > 0) {
            alerts.push({ icon: "bi-bag-check", color: "green", text: `${newOrders.toLocaleString("fa-IR")} سفارش جدید`, link: "orders.html" });
        }
        if (demoProducts > 0) {
            alerts.push({ icon: "bi-info-circle", color: "blue", text: `${demoProducts.toLocaleString("fa-IR")} محصول Demo (قیمت ساختگی)`, link: "products.html" });
        }

        if (alerts.length === 0) {
            alertEl.innerHTML = `<div class="admin-empty" style="padding:30px 20px;"><div class="admin-empty-icon" style="width:70px;height:70px;font-size:1.8rem;background:#ecfdf5;color:#10b981;"><i class="bi bi-check-circle"></i></div><h4 style="margin-bottom:4px;">همه چیز مرتب است</h4><p>هیچ هشداری وجود ندارد</p></div>`;
        } else {
            alertEl.innerHTML = alerts.map(a => `
                <a href="${a.link}" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#f8fafc;margin-bottom:8px;text-decoration:none;color:#1e293b;transition:background 0.2s;" onmouseover="this.style.background='#f1f5f9'" onmouseout="this.style.background='#f8fafc'">
                    <div style="width:40px;height:40px;border-radius:12px;background:${a.color === 'red' ? '#fee2e2' : a.color === 'orange' ? '#fff7ed' : a.color === 'purple' ? '#f5f3ff' : a.color === 'green' ? '#ecfdf5' : '#eff6ff'};color:${a.color === 'red' ? '#ef4444' : a.color === 'orange' ? '#f97316' : a.color === 'purple' ? '#8b5cf6' : a.color === 'green' ? '#10b981' : '#3b82f6'};display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;">
                        <i class="bi ${a.icon}"></i>
                    </div>
                    <div style="flex:1;font-weight:700;font-size:0.88rem;">${a.text}</div>
                    <i class="bi bi-chevron-left" style="color:#94a3b8;"></i>
                </a>
            `).join("");
        }
    }

    function getStatusClass(s) {
        return { pending:"warning", processing:"info", shipped:"info", delivered:"success", cancelled:"danger" }[s] || "neutral";
    }
    function getStatusLabel(s) {
        return { pending:"در انتظار", processing:"پردازش", shipped:"ارسال شده", delivered:"تحویل شده", cancelled:"لغو شده" }[s] || "—";
    }
    </script>
<script src="../js/demo-events.js"></script>
</body>
</html>
