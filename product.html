<body class="glass-body">
<a class="skip-to-content" href="#main-content">رفتن به محتوای اصلی</a>

<div id="header-placeholder"></div>

<nav class="product-breadcrumb" aria-label="مسیر صفحه">
    <div class="container">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">خانه</a></li>
            <li class="breadcrumb-item"><a href="products.html">محصولات</a></li>
            <li class="breadcrumb-item"><a href="#" id="breadcrumbCategory">دسته‌بندی</a></li>
            <li class="breadcrumb-item active" aria-current="page" id="breadcrumbProduct">...</li>
        </ol>
    </div>
</nav>

<section class="product-main-section">
    <div class="container">
        <div class="row g-4" id="productDetailContainer"></div>
    </div>
</section>

<section id="productTabsSection" class="product-tabs-section"></section>

<section class="product-related-section" id="relatedSection">
    <div class="container">
        <div class="product-related-head">
            <h2 class="product-related-title">
                <i class="bi bi-collection"></i>
                محصولات مشابه
            </h2>
            <a href="products.html" class="product-related-all">
                مشاهده همه <i class="bi bi-arrow-left"></i>
            </a>
        </div>
        <div class="product-related-grid" id="relatedProducts"></div>
    </div>
</section>

<div class="cart-alert-popup" id="cartAlertPopup" role="dialog" aria-modal="true">
    <div class="cart-alert-content">
        <div class="cart-alert-icon"><i class="bi bi-person-lock"></i></div>
        <h4>ورود به حساب کاربری</h4>
        <p>برای انجام این عملیات، لطفاً ابتدا وارد حساب خود شوید.</p>
        <div class="cart-alert-buttons">
            <button type="button" class="btn btn-outline-secondary"
                    onclick="document.getElementById('cartAlertPopup').classList.remove('show')">انصراف</button>
            <button type="button" class="btn btn-primary"
                    onclick="window.location.href='auth.html'">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                ورود / ثبت نام
            </button>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<!-- BM Core -->
<script src="js/config.js"></script>

<script src="js/notification-center.js" defer></script>

<script src="js/main.js" defer></script>
<script src="js/notifications.js" defer></script>
<script src="js/ux.js" defer></script>
<script src="js/modal.js" defer></script>
<script src="js/components.js" defer></script>
<script src="js/product.js" defer></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    Promise.all([
        fetch('components/header.html').then(r => r.text()),
        fetch('components/footer.html').then(r => r.text())
    ]).then(([headerHTML, footerHTML]) => {
        document.getElementById('header-placeholder').innerHTML = headerHTML;
        window.dispatchEvent(new CustomEvent('bl:header-ready'));
        if (typeof updateAuthUI === 'function') updateAuthUI();
        document.getElementById('footer-placeholder').innerHTML = footerHTML;
        if (typeof updateAuthUI === 'function') updateAuthUI();
        if (typeof updateCartBadge === 'function') updateCartBadge();
        if (typeof setupHeaderScroll === 'function') setupHeaderScroll();
        if (window.ProductPage) setTimeout(() => ProductPage.init(), 50);
    }).catch(err => console.error('خطا در لود کامپوننت‌ها:', err));
});
</script>
<!-- SEO -->
<script src="js/seo.js" defer></script>
<script src="js/support-chat.js" defer></script>
</body>
