<body class="glass-body" data-category="accessory" data-category-title="لوازم جانبی" data-category-icon="bi-headphones" data-category-desc="هدفون، پاوربانک، شارژر، قاب و گلس با کیفیت">
<a class="skip-to-content" href="#main-content">رفتن به محتوای اصلی</a>

<div id="header-placeholder"></div>

<main id="main-content" class="bm-products-page">
<nav class="bm-breadcrumb" aria-label="مسیر"><div class="container"><ol class="breadcrumb">
<li class="breadcrumb-item"><a href="index.html">خانه</a></li>
<li class="breadcrumb-item"><a href="products.html">محصولات</a></li>
<li class="breadcrumb-item active" id="breadcrumbCurrent">لوازم جانبی</li>
</ol></div></nav>

<section class="bm-category-hero" id="categoryHero"></section>

<div class="container bm-products-container">
<header class="bm-products-head">
<div class="bm-products-head-left"><span class="bm-results-count" id="resultsCount">در حال بارگذاری...</span></div>
<div class="bm-products-head-right"><button type="button" class="bm-mobile-filter-btn" onclick="CategoryPage.toggleFiltersSidebar(true)"><i class="bi bi-funnel"></i><span>فیلترها</span><span class="bm-filter-count-badge" id="mobileFilterBadge">0</span></button></div>
</header>

<div class="bm-products-layout">
<aside class="bm-filter-sidebar" id="filtersSidebar" aria-label="فیلترها">
<div class="bm-filter-sidebar-head">
<h3><i class="bi bi-sliders2"></i> فیلترها</h3>
<button type="button" class="bm-reset-btn" onclick="CategoryPage.resetAllFilters()"><i class="bi bi-arrow-clockwise"></i> حذف همه</button>
<button type="button" class="bm-filter-close-mobile" onclick="CategoryPage.toggleFiltersSidebar(false)"><i class="bi bi-x-lg"></i></button>
</div>
<div class="bm-filter-group"><h4 class="bm-filter-title"><i class="bi bi-award"></i> برند</h4><div class="bm-filter-body" id="brandFilters"></div></div>
<div class="bm-filter-group" id="subcategoryGroup" style="display:none;"><h4 class="bm-filter-title"><i class="bi bi-grid"></i> نوع محصول</h4><div class="bm-filter-body" id="subcategoryFilters"></div></div>
<div class="bm-filter-group"><h4 class="bm-filter-title"><i class="bi bi-cash-coin"></i> حداکثر قیمت</h4><div class="bm-filter-body"><div class="bm-price-range-wrap">
<input type="range" id="priceRange" class="bm-price-range" oninput="CategoryPage.updatePrice(this.value)">
<div class="bm-price-range-labels"><span>۰</span><span class="bm-price-current-label" id="priceValue">—</span></div>
</div></div></div>
<div class="bm-filter-group"><h4 class="bm-filter-title"><i class="bi bi-sliders"></i> سایر</h4><div class="bm-filter-body">
<label class="bm-filter-switch"><span class="bm-filter-switch-label"><i class="bi bi-check-circle"></i> فقط موجود</span><input type="checkbox" id="filterAvailable" class="bm-switch-input" onchange="CategoryPage.toggleAvailable(this.checked)"></label>
<label class="bm-filter-switch"><span class="bm-filter-switch-label"><i class="bi bi-percent"></i> فقط تخفیف‌دار</span><input type="checkbox" id="filterDiscounted" class="bm-switch-input" onchange="CategoryPage.toggleDiscounted(this.checked)"></label>
</div></div>
</aside>

<div class="bm-filters-overlay" id="filtersOverlay" onclick="CategoryPage.toggleFiltersSidebar(false)"></div>

<div class="bm-products-content">
<div class="bm-toolbar">
<div class="bm-toolbar-left">
<span class="bm-toolbar-label"><i class="bi bi-sort-down"></i> مرتب‌سازی:</span>
<div class="bm-sort-pills">
<button type="button" class="bm-sort-pill active" data-sort="newest" onclick="CategoryPage.sort('newest', this)">جدیدترین</button>
<button type="button" class="bm-sort-pill" data-sort="bestselling" onclick="CategoryPage.sort('bestselling', this)">پرفروش</button>
<button type="button" class="bm-sort-pill" data-sort="price-low" onclick="CategoryPage.sort('price-low', this)">ارزان‌ترین</button>
<button type="button" class="bm-sort-pill" data-sort="price-high" onclick="CategoryPage.sort('price-high', this)">گران‌ترین</button>
<button type="button" class="bm-sort-pill" data-sort="rating" onclick="CategoryPage.sort('rating', this)">امتیاز</button>
</div>
</div>
<div class="bm-toolbar-right"><div class="bm-view-toggle">
<button type="button" data-view="grid" class="bm-view-btn active" onclick="CategoryPage.setView('grid', this)"><i class="bi bi-grid-3x3-gap-fill"></i></button>
<button type="button" data-view="list" class="bm-view-btn" onclick="CategoryPage.setView('list', this)"><i class="bi bi-list-ul"></i></button>
</div></div>
</div>
<div class="bm-active-filters" id="activeFiltersBar"></div>
<div id="productsContainer" class="bm-products-grid"></div>
<div class="bm-pagination-wrap" id="paginationWrapper"></div>
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    Promise.all([
        fetch('components/header.html').then(r => r.text()),
        fetch('components/footer.html').then(r => r.text())
    ]).then(([h, f]) => {
        document.getElementById('header-placeholder').innerHTML = h;
        window.dispatchEvent(new CustomEvent('bl:header-ready'));
        if (typeof updateAuthUI === 'function') updateAuthUI();
        document.getElementById('footer-placeholder').innerHTML = f;
        if (typeof updateAuthUI === 'function') updateAuthUI();
        if (typeof updateCartBadge === 'function') updateCartBadge();
        if (window.CategoryPage) setTimeout(() => CategoryPage.init(), 50);
    });
});
</script>
<!-- SEO -->
<script src="js/seo.js" defer></script>
<script src="js/support-chat.js" defer></script>
