<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Blue Market">
  <defs>
    <linearGradient id="bmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="45%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="bmGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#ea580c" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- دایره گرادیانت -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bmGrad)" filter="url(#bmShadow)"/>
  <!-- درخشش بالا-چپ -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bmGlow)"/>

  <!-- حرف B با فلش رو به بالا -->
  <path d="M20 16 H34 C40 16 44 19.5 44 24.5 C44 27.5 42.4 29.8 39.8 31 C43 32.2 45 34.8 45 38 C45 43.4 40.6 47 34.6 47 H20 Z
           M26 21.5 V28.5 H33.5 C36 28.5 37.8 27.2 37.8 25 C37.8 22.8 36 21.5 33.5 21.5 Z
           M26 33.5 V41.5 H34.2 C37 41.5 38.9 40.2 38.9 37.5 C38.9 34.8 37 33.5 34.2 33.5 Z"
        fill="#ffffff"/>

  <!-- فلش رو به بالا (نشانه رشد) کنار B -->
  <path d="M48 30 L54 23 L48 23" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="51" y1="23.5" x2="51" y2="40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>