<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت موفق | بلو مارکت</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="images/logo.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .thankyou-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .thankyou-card {
            background: #fff; border-radius: 28px; padding: 50px 40px; text-align: center;
            max-width: 500px; width: 100%; box-shadow: 0 25px 70px rgba(0, 0, 0, 0.1);
            animation: slideUp 0.6s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .success-icon {
            width: 110px; height: 110px; background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 3.5rem; color: #fff;
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .thankyou-card h1 { font-size: 1.6rem; font-weight: 900; color: #1f2937; margin: 0 0 12px; }
        .thankyou-card p { color: #6b7280; font-size: 0.95rem; line-height: 1.8; margin: 0 0 24px; }
        .tracking-box {
            background: #f0fdf4; border: 2px dashed #10b981; border-radius: 16px;
            padding: 20px; margin-bottom: 28px;
        }
        .tracking-box span { display: block; color: #059669; font-size: 0.85rem; margin-bottom: 8px; font-weight: 700; }
        .tracking-box strong { font-size: 1.3rem; color: #065f46; font-weight: 900; letter-spacing: 1px; }
        .thankyou-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .thankyou-actions a {
            padding: 14px 24px; border-radius: 14px; font-weight: 800; font-size: 0.92rem;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s;
        }
        .btn-home { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; box-shadow: 0 8px 22px rgba(249, 115, 22, 0.35); }
        .btn-home:hover { transform: translateY(-3px); color: #fff; }
        .btn-orders { background: #fff; color: #f97316; border: 2px solid #f97316; }
        .btn-orders:hover { background: #f97316; color: #fff; }
    </style>
</head>
<body>

    <div class="thankyou-page">
        <div class="thankyou-card">
            <div class="success-icon"><i class="bi bi-check-lg"></i></div>
            <h1>پرداخت با موفقیت انجام شد!</h1>
            <p>سفارش شما با موفقیت ثبت شد و به زودی برای شما ارسال خواهد شد. می‌توانید وضعیت سفارش را از پنل کاربری پیگیری کنید.</p>
            
            <div class="tracking-box">
                <span>کد پیگیری سفارش</span>
                <strong id="trackingCode">—</strong>
            </div>

            <div class="thankyou-actions">
                <a href="index.html" class="btn-home"><i class="bi bi-house"></i> بازگشت به خانه</a>
                <a href="account.html#orders" class="btn-orders"><i class="bi bi-bag"></i> پیگیری سفارش</a>
            </div>
        </div>
    </div>

    <!-- BM Core -->
    <script src="js/config.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/adapters/LocalStorageAdapter.js"></script>
    <script src="js/adapters/ApiAdapter.js"></script>
    <script src="js/repositories/ProductsRepository.js"></script>
    <script src="js/repositories/OrdersRepository.js"></script>
    <script src="js/repositories/UsersRepository.js"></script>
    <script src="js/repositories/TicketsRepository.js"></script>
    <script src="js/repositories/NotificationsRepository.js"></script>
    <script src="js/bootstrap.js"></script>
    <script src="js/notification-center.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const tracking = urlParams.get("tracking");
        
        // اگر کد پیگیری از درگاه اومده باشه
        if (tracking) {
            document.getElementById("trackingCode").textContent = tracking;
            
            // ثبت نهایی سفارش (با استفاده از اطلاعات موقت)
            try {
                const pendingOrder = JSON.parse(localStorage.getItem("bl_pending_order") || "null");
                if (pendingOrder) {
                    // اضافه کردن کد پیگیری به سفارش
                    pendingOrder.trackingCode = tracking;
                    pendingOrder.paymentStatus = "paid";
                    
                    // ذخیره سفارش
                    let orders = JSON.parse(localStorage.getItem("bl_orders") || "[]");
                    orders.unshift(pendingOrder);
                    localStorage.setItem("bl_orders", JSON.stringify(orders));
                    
                    // اعلان به ادمین
                    if (window.NotificationCenter?.events?.orderCreated) {
                        NotificationCenter.events.orderCreated(pendingOrder);
                    }
                    
                    // پاک کردن سبد خرید و اطلاعات موقت
                    localStorage.removeItem("shoppingCart");
                    localStorage.removeItem("bl_pending_order");
                    localStorage.removeItem("checkoutData");
                    
                    // نمایش شماره سفارش اصلی
                    document.getElementById("trackingCode").textContent = pendingOrder.id + " | " + tracking;
                }
            } catch (e) {
                console.error("خطا در ثبت سفارش نهایی:", e);
            }
        } else {
            // اگر سفارش مستقیم (مثلاً با کیف پول) ثبت شده بود
            const orderId = urlParams.get("order");
            if (orderId) {
                document.getElementById("trackingCode").textContent = orderId;
            }
        }
    });
    </script>
</body>
</html>
