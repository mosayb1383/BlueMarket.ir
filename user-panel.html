<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>پنل کاربری | بلو مارکت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ux.css">
    <link rel="stylesheet" href="css/user-panel.css">
<meta name="description" content="پنل کاربری بلو مارکت — مدیریت سفارش‌ها، علاقه‌مندی‌ها و اطلاعات حساب">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/support-chat.css">
</head>
<body>
<a class="skip-to-content" href="#main-content">رفتن به محتوای اصلی</a>

    <header class="bg-white shadow-sm">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center py-3">
                <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="bi bi-shop me-2"></i>بلو مارکت</a>
                <div class="nav-actions">
                    <span id="user-greeting">سلام، کاربر</span>
                    <a href="#" onclick="confirmLogout(); return false;" class="btn btn-outline-danger ms-2">خروج</a>
                </div>
            </div>
        </div>
    </header>

    <section class="user-panel py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="user-sidebar">
                        <div class="user-profile-card text-center p-3">
                            <i class="bi bi-person-circle fs-1"></i>
                            <h5 id="userName" class="mt-2">کاربر</h5>
                            <span class="text-muted" id="userPhone">---</span>
                        </div>
                        <div class="panel-menu">
                            <ul class="list-unstyled">
                                <li><a href="#" class="menu-item active" onclick="showSection('orders'); return false;"><i class="bi bi-bag me-2"></i>سفارشات من</a></li>
                                <li><a href="#" class="menu-item" onclick="showSection('wishlist'); return false;"><i class="bi bi-heart me-2"></i>علاقه‌مندی‌ها</a></li>
                                <li><a href="#" class="menu-item" onclick="showSection('profile'); return false;"><i class="bi bi-person me-2"></i>اطلاعات حساب</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="col-md-9">
                    <div id="orders" class="section-content active">
                        <div class="card"><div class="card-header bg-white"><h5 class="mb-0">سفارشات من</h5></div><div class="card-body"><p class="text-muted">شما هنوز سفارشی ثبت نکرده‌اید.</p><a href="products.html" class="btn btn-primary">مشاهده محصولات</a></div></div>
                    </div>
                    <div id="wishlist" class="section-content" style="display: none;">
                        <div class="card"><div class="card-header bg-white"><h5 class="mb-0">علاقه‌مندی‌ها</h5></div><div class="card-body"><p class="text-muted">شما هنوز محصولی به علاقه‌مندی‌ها اضافه نکرده‌اید.</p><a href="products.html" class="btn btn-primary">مشاهده محصولات</a></div></div>
                    </div>
                    <div id="profile" class="section-content" style="display: none;">
                        <div class="card"><div class="card-header bg-white"><h5 class="mb-0">اطلاعات حساب</h5></div><div class="card-body"><form id="profileForm"><div class="mb-3"><label class="form-label">نام کامل</label><input type="text" class="form-control" id="fullName"></div><div class="mb-3"><label class="form-label">ایمیل</label><input type="email" class="form-control" id="email"></div><div class="mb-3"><label class="form-label">شماره موبایل</label><input type="tel" class="form-control" id="phone" readonly></div><button type="submit" class="btn btn-primary">ذخیره تغییرات</button></form></div></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <!-- ════════ BM Core (قبل از همه) ════════ -->
    <script src="js/config.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/adapters/LocalStorageAdapter.js"></script>
    <script src="js/adapters/ApiAdapter.js"></script>
    <script src="js/repositories/ProductsRepository.js"></script>
    <script src="js/repositories/OrdersRepository.js"></script>
    <script src="js/repositories/UsersRepository.js"></script>
    <script src="js/repositories/TicketsRepository.js"></script>
    <script src="js/repositories/NotificationsRepository.js"></script>
    <script src="js/bootstrap.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/notification-center.js" defer></script>
    <script src="js/auth.js"></script>
    <script src="js/product-images.js" defer></script>
    <script src="js/notifications.js" defer></script>
    <script src="js/ux.js" defer></script>
    <script src="js/modal.js"></script>
    <script src="js/components.js"></script>
    <script>
        function showSection(id) {
            document.querySelectorAll('.section-content').forEach(sec => sec.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const user = getCurrentUser();
            if (user && user.isLoggedIn) {
                document.getElementById('userName').textContent = user.name || 'کاربر';
                document.getElementById('userPhone').textContent = user.phone || '---';
                document.getElementById('fullName').value = user.name || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('phone').value = user.phone || '';
            }
            document.getElementById('profileForm')?.addEventListener('submit', function(e) {
                e.preventDefault();
                const user = getCurrentUser();
                user.name = document.getElementById('fullName').value;
                user.email = document.getElementById('email').value;
                saveUser(user);
                showToast('اطلاعات با موفقیت ذخیره شد', 'success');
            });
        });
    </script>
    <!-- SEO -->
<script src="js/seo.js" defer></script>
<script src="js/demo-events.js"></script>
<script src="js/support-chat.js" defer></script>
</body>
</html>
